name: 'exchange_rate_analytics'
version: '1.0.0'
config-version: 2

# Link to the main profile, but tell it to use your new target bucket!
profile: 'exchange_rate_analytics'
# target: 'exchange_rates' (removed on 10/09/26, before it worked fine, now the target is set in the profiles.yml file)

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.

models:
  exchange_rate_analytics: # Matches the name: at the top of your file
    
    # 1. Route all staging models to the staging project
    staging:
      +database: "stg-exchange-rate" # Directs dbt to write here
      +materialized: view

    # 2. Route all marts models to the production/marts project
    marts:
      +database: "exchange-rate-502712"     # Directs dbt to write here
      +materialized: table
